name: Publish handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize public annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-annotations.mjs
      - name: Build static pages
        run: node tools/build.mjs
      - name: Verify links and content
        run: node tools/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
